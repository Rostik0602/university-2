<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We are information security</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Roboto:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="hero">
            <h1 class="hero__title">We are information security.</h1>

            <a class="hero__phone" href="tel:+12345678910">
                <svg class="hero__phone-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2z"/>
                </svg>
                +1 (234) 567-8910
            </a>
        </section>

        <section class="contact">
            <img class="contact__photo" src="images/photo.png" alt="Smiling young woman with red hair">

            <div class="contact__info">
                <h2 class="contact__label">Location</h2>

                <address class="contact__address">
                    121 Rock Sreet, 21 Avenue,<br>
                    New York, NY 92103-9000
                </address>

                <hr class="contact__divider">

                <p class="contact__text">
                    Sample text. Click to select the text box. Click again or double click to start editing the text.
                </p>
            </div>
        </section>
    </main>
</body>
</html>
